[project]
name = "baseline-engine"
version = "0.1.0"
description = "Baseline change engine: Fair layer, personal model and state rules"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pydantic>=2.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseline_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
