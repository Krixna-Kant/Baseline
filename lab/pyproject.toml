[project]
name = "baseline-lab"
version = "0.1.0"
description = "Baseline Validation Lab: simulated cohort generator and metric pipeline"
requires-python = ">=3.11"
dependencies = [
  "baseline-engine",
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseline_lab"]
